<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HS Payroll System</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 30px;
        zoom: 1.33;
        min-height: 100vh;
        background:
          linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
        background-attachment: fixed;
      }

      body, input, select, textarea, button {
        font-size: 20px !important;
      }

      nav {
        height: 100px !important;
        padding: 0 32px !important;
        background: rgba(15, 23, 42, 0.85) !important;
        backdrop-filter: blur(12px) !important;
        border-bottom: 1px solid rgba(96, 165, 250, 0.2) !important;
        box-shadow: 0 4px 24px rgba(0,0,0,0.4) !important;
      }
      nav span, nav a, nav button { font-size: 20px !important; }
      nav > span:first-child { font-size: 28px !important; font-weight: 800 !important; }

      h1 { font-size: 40px !important; }
      h2 { font-size: 34px !important; }
      h3 { font-size: 28px !important; }
      h4 { font-size: 24px !important; }
      h5 { font-size: 22px !important; }

      table, th, td { font-size: 18px !important; }
      th { padding: 16px 20px !important; }
      td { padding: 14px 20px !important; }

      input, select, textarea {
        font-size: 18px !important;
        padding: 12px 16px !important;
        height: auto !important;
        border-radius: 8px !important;
        background: rgba(15, 23, 42, 0.8) !important;
        border: 1px solid rgba(96, 165, 250, 0.2) !important;
        color: #f1f5f9 !important;
      }

      input:focus, select:focus, textarea:focus {
        outline: none !important;
        border-color: rgba(96, 165, 250, 0.6) !important;
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15) !important;
      }

      button {
        font-size: 18px !important;
        padding: 10px 20px !important;
        border-radius: 8px !important;
      }

      label { font-size: 18px !important; }
      p { font-size: 18px !important; }
      span { font-size: 16px !important; }

      /* Cards and panels get glass effect */
      div[style*="background: #1e293b"],
      div[style*="background:#1e293b"] {
        background: rgba(30, 41, 59, 0.75) !important;
        backdrop-filter: blur(10px) !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
      }

      /* Table background */
      div[style*="background: #1e293b"] table {
        background: transparent !important;
      }

      /* Glowing animated background blobs */
      body::before {
        content: '';
        position: fixed;
        top: -200px;
        left: -200px;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        animation: blob1 12s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }

      body::after {
        content: '';
        position: fixed;
        bottom: -200px;
        right: -200px;
        width: 700px;
        height: 700px;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
        border-radius: 50%;
        animation: blob2 15s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }

      @keyframes blob1 {
        0%   { transform: translate(0px, 0px) scale(1); }
        33%  { transform: translate(80px, 60px) scale(1.1); }
        66%  { transform: translate(-40px, 100px) scale(0.95); }
        100% { transform: translate(0px, 0px) scale(1); }
      }

      @keyframes blob2 {
        0%   { transform: translate(0px, 0px) scale(1); }
        33%  { transform: translate(-60px, -80px) scale(1.05); }
        66%  { transform: translate(80px, -40px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }

      /* Make sure content sits above background blobs */
      #root {
        position: relative;
        z-index: 1;
      }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1e293b; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
